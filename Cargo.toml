[package]
name = "net-tap"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
pcap = "2.4.0"
pnet = "0.35.0"
pnet_packet = "0.35.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
sse-binary = { git = "https://github.com/xinchentechnote/fin-proto-sse-bin-rs.git", tag = "v0.1.0" }
binary-codec = { git = "https://github.com/xinchentechnote/fin-proto-runtime-bin-rs.git", tag = "v0.1.0" }
bytes = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1.0.145"
anyhow = "1.0.102"
lazy_static = "1.5.0"
